services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    image: ${GHCR_REPO}/api:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      NODE_ENV: production
      PORT: 3001
      # SP-13 (2026-05-23): JWT auth env. All 4 vars REQUIRED in prod —
      # loadAuthConfig() crashes the API at boot if missing (fail-fast).
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # COOKIE_DOMAIN optional — only set when sharing cookies across
      # subdomains. Leave unset for the single hotnews.shinpeionline.top host.
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # COOKIE_SECURE defaults to true in prod (NODE_ENV=production). Override
      # to "false" only when serving over plain HTTP (test environments).
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    ports:
      # 仅 bind 到 127.0.0.1，对外不暴露；cloudflared 可按需 ingress
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    image: ${GHCR_REPO}/worker:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      NODE_ENV: production
      # SP-4.7 ArticleExtractor + SP-5 Summarize: passed via .env. Compose only
      # substitutes variables that are explicitly declared here, otherwise they
      # end up blank inside the container even if .env has them.
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
      JINA_API_KEY: ${JINA_API_KEY}
      EXTRACT_CONCURRENCY: ${EXTRACT_CONCURRENCY:-2}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      SUMMARY_MODEL: ${SUMMARY_MODEL:-deepseek/deepseek-v3.2}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      SUMMARY_CONCURRENCY: ${SUMMARY_CONCURRENCY:-3}
      # SP-6 heat scoring. All optional; loadHeatConfig() falls back to safe
      # defaults if any of these are unset/invalid (HEAT_DECAY_TAU_HOURS=48,
      # HEAT_CRON_INTERVAL_MIN=30, HEAT_BATCH_SIZE=500, HEAT_CONCURRENCY=2,
      # INTERACTION_MAX_HN=500, INTERACTION_MAX_REDDIT=5000,
      # INTERACTION_MAX_TWITTER=100000). Listed explicitly so compose passes
      # them through when set in .env (SP-4.7 lesson).
      HEAT_DECAY_TAU_HOURS: ${HEAT_DECAY_TAU_HOURS:-48}
      HEAT_CRON_INTERVAL_MIN: ${HEAT_CRON_INTERVAL_MIN:-30}
      HEAT_BATCH_SIZE: ${HEAT_BATCH_SIZE:-500}
      HEAT_CONCURRENCY: ${HEAT_CONCURRENCY:-2}
      INTERACTION_MAX_HN: ${INTERACTION_MAX_HN:-500}
      INTERACTION_MAX_REDDIT: ${INTERACTION_MAX_REDDIT:-5000}
      INTERACTION_MAX_TWITTER: ${INTERACTION_MAX_TWITTER:-100000}
      # SP-7: OpenRouter is reused for embeddings (same OPENROUTER_API_KEY as
      # SP-5 summary above). Only the embed-specific tunables need explicit
      # declaration here; SP-4.7 PR #3 lesson — listing in .env is not enough.
      EMBED_MODEL: ${EMBED_MODEL:-openai/text-embedding-3-small}
      EMBED_CONCURRENCY: ${EMBED_CONCURRENCY:-2}
      # SP-10.5 data lifecycle: hot_news 30d TTL, heat_history 7d TTL, daily
      # cron @ 03:00 UTC. Override via .env if a shorter / longer retention is
      # ever needed (e.g. CLEANUP_HOT_NEWS_DAYS=14 for cost-cut experiment).
      CLEANUP_HOT_NEWS_DAYS: ${CLEANUP_HOT_NEWS_DAYS:-30}
      CLEANUP_HEAT_HISTORY_DAYS: ${CLEANUP_HEAT_HISTORY_DAYS:-7}
      CLEANUP_CRON_HOUR_UTC: ${CLEANUP_CRON_HOUR_UTC:-3}
      # SP-16 keyword detection: worker concurrency for keyword-match queue +
      # boot backstop scan window (days). Defaults 2 / 30 sized for the
      # 1.4k visible row, ~10 keyword scale. SP-15 UI doesn't depend on these.
      KEYWORD_MATCH_CONCURRENCY: ${KEYWORD_MATCH_CONCURRENCY:-2}
      KEYWORD_MATCH_BACKSTOP_DAYS: ${KEYWORD_MATCH_BACKSTOP_DAYS:-30}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test \"$(($(date +%s) - $(cat /tmp/worker-alive 2>/dev/null || echo 0)))\" -lt 90"]
      interval: 60s
      timeout: 5s
      retries: 3

  web:
    image: ${GHCR_REPO}/web:${IMAGE_TAG:-latest}
    environment:
      # Server-side (RSC + BFF route /api/hot-news) calls the API container over the compose network.
      # Keep NEXT_PUBLIC_API_URL only in case a future client component needs the public URL.
      API_URL: http://api:3001
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
      NODE_ENV: production
      # Next.js standalone 默认只绑容器 service IP，不绑 127.0.0.1，导致 healthcheck 'wget localhost' 失败
      HOSTNAME: 0.0.0.0
    ports:
      # 仅 bind 到 127.0.0.1，对外不暴露；cloudflared 通过 host loopback 访问
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
