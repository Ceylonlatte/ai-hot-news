  button, input, select { font-family: inherit; color: inherit; outline: none; border: none; background: none; }

  .glass {

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.8);
    border-radius: 18px;

  .glass-hover { transition: transform .3s cubic-bezier(0.2,0.8,0.2,1), box-shadow .3s, border-color .3s; }

  .ab-1 { width: 480px; height: 480px; background: #d9ccff; top: -100px; left: 200px; animation: drift1 25s ease-in-out infinite; }
  .ab-2 { width: 380px; height: 380px; background: #e8dcff; top: 30%; right: -100px; animation: drift2 30s ease-in-out infinite; }
  .ab-3 { width: 420px; height: 420px; background: #ebe3ff; bottom: -100px; left: 30%; animation: drift3 35s ease-in-out infinite; }
  @keyframes drift1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(120px, 80px); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-100px, 100px); } }
  @keyframes drift3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(80px, -80px); } }

  @keyframes fadeUp { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform: translateY(0); } }
  .fade-up { animation: fadeUp .6s cubic-bezier(0.2,0.6,0.2,1) backwards; }
  @keyframes fillBar { from { width: 0; } }
  .fill-bar { animation: fillBar 1.2s cubic-bezier(0.2,0.8,0.2,1) backwards; }
  @keyframes pulse-ring {

  .pulse-ring { position: relative; }
  .pulse-ring::after { content:''; position: absolute; inset: 0; border-radius: 50%; background: currentColor; opacity: 0.3; animation: pulse-ring 2s ease-out infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }
  .blink { animation: blink 2s ease-in-out infinite; }
</style>

// ─── Hooks ───────────────────────────────────────────────────
function useCountUp(target, duration=1400) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    let raf, start;
    const step = ts => {
      if (!start) start = ts;
      const p = Math.min((ts - start) / duration, 1);
      const eased = 1 - Math.pow(1 - p, 3);
      setVal(Math.floor(eased * target));
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target, duration]);
  return val;
}

// ─── Atoms ───────────────────────────────────────────────────
function Pill({ p }) {
  const i = PLAT[p];

}

function HeatBadge({ score }) {
  const color = score>=90?"#14131a":score>=70?"#7e57f5":score>=50?"#5a5763":"#9b97a3";
  const bg = score>=90?"rgba(20,19,26,0.08)":score>=70?"rgba(126,87,245,0.10)":score>=50?"rgba(90,87,99,0.08)":"rgba(155,151,163,0.10)";
  const label = score>=90?"爆发":score>=70?"热门":score>=50?"关注":"普通";
  return (
    <span style={{ display:"inline-flex", alignItems:"center", gap:6, padding:"4px 10px", borderRadius:99, background:bg, color, fontSize:12, fontWeight:600, border:`1px solid ${color}22` }}>
      <span style={{ fontFamily:"'Inter Tight',sans-serif", letterSpacing:"-0.02em" }}>{label} · {score}</span>
    </span>
  );
}

function Tag({ children, color="var(--c1)" }) {
  return <span style={{ fontSize:11, padding:"2px 9px", borderRadius:99, background:`${color}10`, color, border:`1px solid ${color}20`, fontWeight:500 }}>{children}</span>;
}

function MiniSpark({ data, color="#7e57f5", w=80, h=28 }) {
  const max=Math.max(...data), min=Math.min(...data);
  const pts = data.map((v,i)=>`${i*(w/(data.length-1))},${h-((v-min)/(max-min||1))*h*0.85-h*0.075}`).join(" ");
  const last = pts.split(" ").pop().split(",");
  return (
    <svg width={w} height={h}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round" />
      <circle cx={last[0]} cy={last[1]} r="2.5" fill={color} />
    </svg>
  );
}

function HeatCurve() {
  const data = [12,18,24,31,28,45,67,89,94,78,56,43,38,51,76,92,87,74,62,55,48,39,44,58];
  const w=1000, h=120;
  const max=100;
  const pts = data.map((v,i)=>`${i*(w/(data.length-1))},${h-(v/max)*h*0.85-h*0.075}`);
  return (
    <div>
      <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{ display:"block" }}>
        <defs>
          <linearGradient id="hc-line" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0%" stopColor="#7e57f5"/><stop offset="50%" stopColor="#a584ff"/><stop offset="100%" stopColor="#7e57f5"/>
          </linearGradient>
          <linearGradient id="hc-fill" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stopColor="#7e57f5" stopOpacity="0.3"/><stop offset="100%" stopColor="#7e57f5" stopOpacity="0"/>
          </linearGradient>
        </defs>
        <path d={`M${pts[0]} ${pts.slice(1).join(" ")} L${w},${h} L0,${h} Z`} fill="url(#hc-fill)" />
        <polyline points={pts.join(" ")} fill="none" stroke="url(#hc-line)" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
        {pts.map((p,i)=>{ if (i%4!==0) return null; const [x,y]=p.split(","); return <circle key={i} cx={x} cy={y} r="3" fill="#fff" stroke="#7e57f5" strokeWidth="1.5" />; })}
      </svg>
      <div style={{ display:"flex", justifyContent:"space-between", marginTop:8 }} className="mono">
        {["00:00","04:00","08:00","12:00","16:00","20:00","现在"].map((t,i) => (
          <span key={t} style={{ fontSize:10, color: i===6?"var(--c2)":"var(--ink-3)", fontWeight:i===6?600:400 }}>{t}</span>
        ))}
      </div>
    </div>
  );
}

function Radar({ keywords, sel, setSel }) {
  const [angle, setAngle] = useState(0);
  useEffect(() => {
    let raf;
    const tick = () => { setAngle(a => (a+0.4) % 360); raf = requestAnimationFrame(tick); };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, []);
  const size = 380, c = size/2;
  return (
    <div style={{ display:"flex", justifyContent:"center" }}>
      <svg width={size} height={size}>
        <defs>
          <radialGradient id="rsweep">
            <stop offset="0%" stopColor="rgba(126,87,245,0.35)" />
            <stop offset="100%" stopColor="rgba(126,87,245,0)" />
          </radialGradient>
          <radialGradient id="rcenter">
            <stop offset="0%" stopColor="rgba(255,255,255,0.5)" />
            <stop offset="100%" stopColor="rgba(255,255,255,0)" />
          </radialGradient>
        </defs>
        <circle cx={c} cy={c} r="170" fill="url(#rcenter)" />
        {[50, 100, 150].map(r => (
          <circle key={r} cx={c} cy={c} r={r} fill="none" stroke="rgba(126,87,245,0.15)" strokeWidth="1" strokeDasharray="2 4" />
        ))}
        <line x1={c} y1="20" x2={c} y2={size-20} stroke="rgba(126,87,245,0.1)" />
        <line x1="20" y1={c} x2={size-20} y2={c} stroke="rgba(126,87,245,0.1)" />
        <g transform={`rotate(${angle} ${c} ${c})`}>
          <path d={`M ${c} ${c} L ${c+170} ${c} A 170 170 0 0 0 ${c + 170*Math.cos(-Math.PI/3)} ${c + 170*Math.sin(-Math.PI/3)} Z`} fill="url(#rsweep)" />
          <line x1={c} y1={c} x2={c+170} y2={c} stroke="#7e57f5" strokeWidth="1.5" strokeLinecap="round" />
        </g>
        {keywords.map((k, i) => {
          const a = (i/keywords.length) * Math.PI * 2 - Math.PI/2;
          const r = 50 + (k.score/100) * 110;
          const x = c + r * Math.cos(a), y = c + r * Math.sin(a);
          const isSel = sel?.id === k.id;
          const col = !k.on ? "#d0ccd5" : k.score>=80 ? "#14131a" : k.score>=60 ? "#7e57f5" : "#7e57f5";
          return (
            <g key={k.id} onClick={() => setSel(k)} style={{ cursor:"pointer" }}>
              {isSel && <circle cx={x} cy={y} r="14" fill="none" stroke={col} strokeWidth="1.5" opacity="0.5" />}
              <circle cx={x} cy={y} r={isSel?7:5} fill={col} style={{ transition:"all .3s", filter:`drop-shadow(0 0 ${isSel?8:4}px ${col})` }} />
              <text x={x} y={y - 14} textAnchor="middle" fontSize="11" fontFamily="Inter Tight" fontWeight={isSel?700:500} fill={isSel?col:"#5a5763"}>{k.keyword}</text>
            </g>
          );
        })}
        <circle cx={c} cy={c} r="4" fill="#7e57f5" />
        <circle cx={c} cy={c} r="8" fill="none" stroke="#7e57f5" strokeWidth="1" opacity="0.4" />
      </svg>
    </div>
  );
}

      <PageHeader kicker="Vault" title="内容库" sub="所有抓取数据可搜索、可回溯" />

// ─── App ─────────────────────────────────────────────────────
function App() {
  const [page, setPage] = useState("home");
  const [item, setItem] = useState(null);
  const openItem = (n) => { setItem(n); setPage("detail"); };

  const pages = {
    home: <HomePage setPage={setPage} openItem={openItem} />,
    feed: <FeedPage openItem={openItem} />,
    detail: <DetailPage item={item} setPage={setPage} />,
    radar: <RadarPage />,
    trends: <TrendsPage />,
    vault: <VaultPage openItem={openItem} />,
  };

  return (
    <>
      <Sidebar page={page==="detail"?"feed":page} setPage={setPage} notif={3} />
      {pages[page] || pages.home}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
